name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Lint, Test & Validate (Python 3.12)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ruff Linting & Code Quality Checks
      run: |
        ruff check src/ api/ tests/ scripts/

    - name: Run Pytest Suite with Coverage Reporting
      run: |
        pytest -v --cov=src --cov=api --cov-report=term-missing --maxfail=1

    - name: Validate Deterministic Benchmark Reproduction
      run: |
        python scripts/reproduce_benchmarks.py

    - name: Validate Live Integration Pipeline
      run: |
        python scripts/test_live_pipeline.py

    - name: Build Docker Container
      run: |
        docker build -t seo-ai-intelligence:ci .
