name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Build, Lint & Test Pipeline
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (Pytest)
      run: |
        pytest -v --maxfail=1

    - name: Validate GSC Ingestion Pipeline
      run: |
        python -c "from src.models.gsc_pipeline import GSCDataPipeline; p = GSCDataPipeline(); metrics = p.train_on_gsc_data(); print('GSC Pipeline Validation Passed:', metrics)"

    - name: Build Docker Container
      run: |
        docker build -t seo-ai-intelligence:ci .
